<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Sarthak Jewellaries</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">Sarthak Jewellaries</a>
            </div>
            <div class="nav-icons">
                <a href="index.html" class="icon" title="Go Home"><i class="fas fa-home"></i></a>
            </div>
        </div>
    </nav>

    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <h2>Reset Password</h2>
                <p>Recover access to your account</p>
            </div>

            <form id="forgot-form" class="login-form">
                <!-- Step 1: Phone -->
                <div id="step-phone">
                    <div class="input-group">
                        <label for="phone">Registered Mobile Number (+91)</label>
                        <input type="tel" id="phone" pattern="[0-9]{10}" maxlength="10" required placeholder="Enter 10-digit mobile number">
                    </div>
                    <button type="button" id="btn-send-otp" class="btn btn-primary login-submit-btn">Send OTP</button>
                </div>

                <!-- Step 2: OTP -->
                <div id="step-otp" style="display: none;">
                    <div class="input-group">
                        <label for="otp">Enter OTP</label>
                        <input type="text" id="otp" maxlength="6" placeholder="Enter the 6-digit OTP">
                    </div>
                    <button type="button" id="btn-verify-otp" class="btn btn-primary login-submit-btn">Verify OTP</button>
                    <div style="text-align: center; margin-top: 10px;">
                        <a href="#" id="btn-back-phone" style="color: var(--primary-color); font-size: 0.9rem;">Change Mobile Number</a>
                    </div>
                </div>

                <!-- Step 3: Passwords -->
                <div id="step-passwords" style="display: none;">
                    <div class="input-group">
                        <label for="password">New Password</label>
                        <input type="password" id="password" placeholder="Create a new password">
                    </div>
                    <div class="input-group">
                        <label for="confirm-password">Confirm New Password</label>
                        <input type="password" id="confirm-password" placeholder="Confirm your new password">
                    </div>
                    <button type="submit" id="btn-reset" class="btn btn-primary login-submit-btn">Reset Password</button>
                </div>
                
                <div class="register-link" style="margin-top: 20px;">
                    <p>Remembered your password? <a href="login.html">Sign in</a></p>
                </div>
            </form>
        </div>
    </div>

    <!-- Custom Popup Message -->
    <div id="toast-popup" class="toast-popup">
        <i id="toast-icon" class="fas"></i>
        <span id="toast-message">Message</span>
    </div>

    <script src="forgot-password.js"></script>
</body>
</html>
