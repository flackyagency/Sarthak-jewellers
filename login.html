<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sarthak Jewellaries</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">
    <!-- Simplified Navigation for Login -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">Sarthak Jewellaries</a>
            </div>
            <div class="nav-icons">
                <a href="index.html" class="icon" title="Go Home"><i class="fas fa-home"></i></a>
            </div>
        </div>
    </nav>

    <!-- Login Container -->
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <h2>Welcome Back</h2>
                <p>Sign in to your account</p>
            </div>
            
            <div class="login-tabs">
                <button class="tab-btn active" onclick="switchTab('customer', event)">Customer</button>
                <button class="tab-btn" onclick="switchTab('owner', event)">Owner</button>
            </div>

            <form id="login-form" class="login-form">
                <div class="input-group">
                    <label for="phone">Mobile Number (+91)</label>
                    <input type="tel" id="phone" pattern="[0-9]{10}" maxlength="10" required placeholder="Enter 10-digit mobile number">
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter your password">
                </div>

                <div style="text-align: right; margin-top: -10px; margin-bottom: 20px;">
                    <a href="forgot-password.html" style="color: var(--primary-color); font-size: 0.9rem; text-decoration: none;">Forgot Password?</a>
                </div>
                
                <button type="submit" class="btn btn-primary login-submit-btn" id="submit-btn">Sign In as Customer</button>
                
                <div class="register-link" id="register-container">
                    <p>Don't have an account? <a href="register.html">Create one</a></p>
                </div>
            </form>
        </div>
    </div>

    <!-- Custom Popup Message -->
    <div id="toast-popup" class="toast-popup">
        <i id="toast-icon" class="fas"></i>
        <span id="toast-message">Message</span>
    </div>

    <script src="login.js"></script>
</body>
</html>
